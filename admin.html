
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin | Mirzapur Home Service</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f6f2ff;color:#28143f}
header{background:#59209d;color:white;text-align:center;padding:32px 12px}
header h1{font-size:27px;margin:10px 0}
header p{margin:8px}
main{max-width:650px;margin:35px auto;padding:15px}
.card{background:white;padding:25px;border-radius:18px;margin-bottom:20px;box-shadow:0 4px 16px #ddd2ed}
input{width:100%;padding:15px;margin:10px 0;border:1px solid #bbb;border-radius:9px;font-size:16px}
button{background:#6225ab;color:white;border:0;padding:14px 25px;border-radius:9px;font-size:16px;cursor:pointer}
button:disabled{opacity:.6}
.hide{display:none}
#status{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}
.success{color:green}
.error{color:#c62828}
</style>
</head>
<body>

<header>
<h1>Mirzapur Home Service</h1>
<p>Secure Admin Login</p>
</header>

<main>
<div class="card" id="loginPanel">
<h2>Admin Login</h2>
<form id="loginForm">
<input type="email" id="email" placeholder="Admin Email" required>
<input type="password" id="password" placeholder="Password" required>
<button type="submit" id="loginBtn">Login</button>
</form>
</div>

<div class="card hide" id="dashboard">
<h2>Admin Dashboard</h2>
<p class="success">Admin Login Successful!</p>
<p>आपकी Admin पहचान सत्यापित हो गई है।</p>
<p>Customer Management, Payment Approval, Subscription और Referral System अगले चरण में जोड़े जाएँगे।</p>
<button id="logoutBtn">Logout</button>
</div>

<div class="card">
<h3>System Status</h3>
<div id="status" role="status" aria-live="polite">JavaScript शुरू हो रहा है...</div>
</div>
</main>

<script>
const statusBox=document.getElementById("status");
const loginBtn=document.getElementById("loginBtn");

function showStatus(message,error=false){
 statusBox.textContent=message;
 statusBox.className=error?"error":"";
}

window.addEventListener("error",function(e){
 showStatus("JavaScript Error: "+e.message,true);
});

window.addEventListener("unhandledrejection",function(e){
 showStatus("System Error: "+String(e.reason),true);
});
</script>

<script type="module">
const $=id=>document.getElementById(id);

try {
 showStatus("Firebase से कनेक्ट हो रहा है...");

 const {auth,db}=await import("./firebase-config.js");

 const {
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
 }=await import("https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js");

 const {doc,getDoc}=await import("https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js");

 showStatus("Firebase Connected. Admin Login करें।");

 let busy=false;

 $("loginForm").addEventListener("submit",async e=>{
  e.preventDefault();
  if(busy)return;
  busy=true;
  loginBtn.disabled=true;
  showStatus("Login प्रक्रिया शुरू हो गई है...");

  try{
   const email=$("email").value.trim();
   const password=$("password").value;

   showStatus("Firebase Authentication जाँच रहा है...");

   const result=await signInWithEmailAndPassword(auth,email,password);

   showStatus("Login सफल। Admin Permission जाँच रहे हैं...");

   const snapshot=await getDoc(doc(db,"admins",result.user.uid));

   if(!snapshot.exists() || snapshot.data().active!==true){
    showStatus("Login सफल, लेकिन Admin Permission नहीं मिली। Firestore में Admin UID और active=true सेट करना होगा।",true);
    await signOut(auth);
    return;
   }

   $("loginPanel").classList.add("hide");
   $("dashboard").classList.remove("hide");
   $("password").value="";
   showStatus("Admin Verified Successfully!");

  }catch(error){
   showStatus("Login Error: "+error.code+"\n"+error.message,true);
  }finally{
   busy=false;
   loginBtn.disabled=false;
  }
 });

 $("logoutBtn").addEventListener("click",async()=>{
  await signOut(auth);
  $("dashboard").classList.add("hide");
  $("loginPanel").classList.remove("hide");
  showStatus("Logout सफल।");
 });

 onAuthStateChanged(auth,user=>{
  if(!user){
   $("dashboard").classList.add("hide");
   $("loginPanel").classList.remove("hide");
  }
 });

}catch(error){
 showStatus("Firebase Load Error: "+(error.message||String(error)),true);
}
</script>

</body>
</html>
